name: 每日自动刷新聚合配置

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 10:00 北京时间
  workflow_dispatch:  # 手动触发：Actions 页面点 Run workflow
  # 注意：不要加 push 触发。每次推送 merge.py 都会触发一次运行，而推送
  # 本身（API 直推 JX.json）和运行的提交会抢跑，导致推送被拒
  # （2026-11-23 上午连续 6 次运行全因此失败）。合并结果由推送方直接
  # 提交，定时任务只负责每天拉取上游更新。

permissions:
  contents: write

# 串行执行：同一时间只跑一个刷新，避免两个任务同时提交导致推送冲突
concurrency:
  group: tvbox-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests pycryptodome

      - name: 拉取并合并接口
        run: python3 merge.py

      - name: 提交更新
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add JX.json merge_stats.json decoded/ urlmap.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "自动刷新：$(date -u +%Y-%m-%d) 聚合配置更新"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 电视用 jsDelivr 拉配置，jsDelivr 有缓存；刷新完立刻清缓存，
      # 电视 10:05-10:10 左右就能拉到最新版（不加这步要等到 10:10-10:15）
      - name: 清理 jsDelivr 缓存
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/artistnian-droid/jx@main/JX.json"
          curl -s "https://purge.jsdelivr.net/gh/artistnian-droid/jx@main/logo.png"
